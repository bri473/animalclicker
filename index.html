    <main class="flex flex-1 gap-4 "> 
      <div class="flex-1 bg-pink-200 ">

      <img src="src/assets/puppy.png" width="700" >
     </button>
      </div>
    
      <div class="flex-1 flex  bg-light to-pink-200 " .text-center {
        text-align: center;
    }
     >

       <!-- The store item button -->

        <section class="flex flex-wrap justify-center gap-4">

    

       <button id="upgradeOne" class="   items-center-safe ">

      <button id="upgradeTwo" class="flex  bg-gray-400- items-center-safe"
        >

      </button>
